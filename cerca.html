<script>

/* ============================================================
   CONFIGURAZIONE INDICE
   ============================================================ */

const CANDIDATE_INDEX_URLS = [

  '/search-index.json',

  '/search-index.json?v=20260826'

];


/* ============================================================
   PARSER JSON
   ============================================================ */

function parseIndexText(text) {

  try {

    return JSON.parse(text);

  } catch (_) {}

  return null;
}


/* ============================================================
   CARICAMENTO INDICE
   ============================================================ */

async function tryFetch(url) {

  try {

    const response =
      await fetch(
        url,
        {
          cache: 'no-store'
        }
      );


    if (!response.ok) {

      throw new Error(
        'HTTP ' + response.status
      );

    }


    const text =
      await response.text();


    const raw =
      parseIndexText(text);


    if (!raw) {

      throw new Error(
        'JSON non valido'
      );

    }


    const items =
      Array.isArray(raw)
        ? raw
        : Array.isArray(raw.items)
          ? raw.items
          : [];


    return items.map(item => ({

      title:
        item.title ||
        item.name ||
        item.slug ||
        'Senza titolo',

      url:
        item.url ||
        item.link ||
        '',

      category:
        item.category ||
        item.categoria ||
        item.section ||
        item.tag ||
        item.type ||
        '',

      description:
        item.description ||
        item.desc ||
        item.excerpt ||
        item.summary ||
        '',

      date:
        item.date ||
        ''

    }));

  }

  catch (error) {

    console.warn(
      '[Ricerca] Indice non disponibile:',
      url,
      error
    );

    return null;
  }
}


/* ============================================================
   CARICA IL PRIMO INDICE VALIDO
   ============================================================ */

async function loadIndex() {

  for (
    const url of CANDIDATE_INDEX_URLS
  ) {

    const items =
      await tryFetch(url);


    if (
      items &&
      items.length
    ) {

      console.log(
        '[Ricerca] Indice caricato:',
        url,
        items.length,
        'elementi'
      );

      return items;
    }

  }


  throw new Error(
    'Nessun indice di ricerca valido.'
  );
}


/* ============================================================
   NORMALIZZAZIONE
   ============================================================ */

function normalize(value) {

  return String(
    value || ''
  )
  .toLowerCase()
  .normalize('NFD')
  .replace(
    /[\u0300-\u036f]/g,
    ''
  )
  .trim();
}


/* ============================================================
   URL — PARTE FONDAMENTALE
   ============================================================

   NON costruiamo più il link dal titolo.

   Usiamo il vero URL presente nell'indice.

   Se l'indice contiene:

       2nietzsche.html

   diventa:

       /articoli/2nietzsche.html

   Se contiene:

       articoli/2nietzsche.html

   diventa:

       /articoli/2nietzsche.html

   Se contiene già:

       /articoli/2nietzsche.html

   rimane invariato.

   ============================================================ */

function resolveArticleUrl(rawUrl) {

  let url =
    String(rawUrl || '').trim();


  if (!url) {

    return '';
  }


  /* URL assoluto */

  if (
    /^https?:\/\//i.test(url)
  ) {

    return url;
  }


  /* slash iniziale */

  url =
    url.replace(
      /^\/+/,
      ''
    );


  /*
     Se l'URL appartiene già
     alla cartella articoli,
     non aggiungiamo nulla.
  */

  if (
    /^articoli\//i.test(url)
  ) {

    return '/' + url;
  }


  /*
     Se è un file HTML semplice,
     appartiene alla cartella articoli.
  */

  if (
    /\.html?(\?.*)?(#.*)?$/i.test(url)
  ) {

    return '/articoli/' + url;
  }


  return '';
}


/* ============================================================
   FILTRO ARTICOLI
   ============================================================ */

const EXCLUDE_URLS =
  new Set([

    '/articoli/cinismo.html',

    '/articoli/epicureismo.html',

    '/articoli/filosofia-indiana.html',

    '/articoli/platonismo.html',

    '/articoli/scetticismo.html',

    '/articoli/stoicismo.html'

  ]);


/* ============================================================
   PREPARAZIONE DATI
   ============================================================ */

function prepareArticles(items) {

  return items

    .map(item => {

      const url =
        resolveArticleUrl(
          item.url
        );


      return {

        ...item,

        url: url,

        _search:
          normalize(
            [
              item.title,
              item.category,
              item.description
            ].join(' ')
          )

      };

    })


    .filter(item => {

      if (!item.url) {

        return false;
      }


      if (
        EXCLUDE_URLS.has(
          item.url
        )
      ) {

        return false;
      }


      return (
        /^\/articoli\/.+\.html?$/i
          .test(item.url)
      );

    });

}


/* ============================================================
   RICERCA
   ============================================================ */

function searchArticles(
  articles,
  query
) {

  const q =
    normalize(query);


  if (!q) {

    return [];
  }


  const terms =
    q.split(/\s+/)
      .filter(Boolean);


  return articles

    .filter(article => {

      return terms.every(
        term =>
          article._search.includes(term)
      );

    })


    .sort((a, b) => {

      const at =
        normalize(a.title);

      const bt =
        normalize(b.title);


      const aExact =
        at === q;

      const bExact =
        bt === q;


      if (
        aExact !== bExact
      ) {

        return aExact
          ? -1
          : 1;
      }


      const aStarts =
        at.startsWith(q);

      const bStarts =
        bt.startsWith(q);


      if (
        aStarts !== bStarts
      ) {

        return aStarts
          ? -1
          : 1;
      }


      return at.localeCompare(
        bt,
        'it'
      );

    });

}


/* ============================================================
   ESCAPE HTML
   ============================================================ */

function escapeHtml(value) {

  return String(value || '')
    .replace(
      /&/g,
      '&amp;'
    )
    .replace(
      /</g,
      '&lt;'
    )
    .replace(
      />/g,
      '&gt;'
    )
    .replace(
      /"/g,
      '&quot;'
    )
    .replace(
      /'/g,
      '&#039;'
    );
}


/* ============================================================
   EVIDENZIAZIONE
   ============================================================ */

function highlight(
  text,
  query
) {

  const safe =
    escapeHtml(text);


  const q =
    normalize(query);


  if (!q) {

    return safe;
  }


  const terms =
    q.split(/\s+/)
      .filter(Boolean)
      .sort(
        (a, b) =>
          b.length - a.length
      );


  if (!terms.length) {

    return safe;
  }


  const pattern =
    terms
      .map(
        term =>
          term.replace(
            /[.*+?^${}()|[\]\\]/g,
            '\\$&'
          )
      )
      .join('|');


  try {

    return safe.replace(

      new RegExp(
        `(${pattern})`,
        'gi'
      ),

      '<mark>$1</mark>'

    );

  }

  catch (_) {

    return safe;
  }

}


/* ============================================================
   CATEGORIE
   ============================================================ */

function buildCategories(
  articles
) {

  const map =
    new Map();


  for (
    const article of articles
  ) {

    const category =
      article.category ||
      'Senza categoria';


    map.set(
      category,
      (map.get(category) || 0) + 1
    );

  }


  return Array.from(
    map.entries()
  )
  .sort(
    (a, b) =>
      b[1] - a[1] ||
      a[0].localeCompare(
        b[0],
        'it'
      )
  );

}


/* ============================================================
   RENDER CATEGORIE
   ============================================================ */

function renderCategories(
  categories,
  currentCategory
) {

  const nav =
    document.getElementById(
      'cat-list'
    );


  if (!nav) {

    return;
  }


  nav.innerHTML = '';


  const total =
    categories.reduce(
      (sum, [, count]) =>
        sum + count,
      0
    );


  function createItem(
    label,
    key,
    count
  ) {

    const button =
      document.createElement(
        'button'
      );


    button.type =
      'button';


    button.className =
      'cat-item';


    if (
      currentCategory === key
    ) {

      button.classList.add(
        'active'
      );
    }


    button.dataset.key =
      key;


    button.innerHTML = `

      <span class="cat-name">
        ${escapeHtml(label)}
      </span>

      <span class="cat-count">
        ${count}
      </span>

    `;


    return button;
  }


  nav.appendChild(

    createItem(
      'Tutte',
      '',
      total
    )

  );


  for (
    const [category, count]
      of categories
  ) {

    nav.appendChild(

      createItem(
        category,
        category,
        count
      )

    );

  }

}


/* ============================================================
   RENDER ARTICOLI
   ============================================================ */

function renderArticles(
  articles,
  query
) {

  const root =
    document.getElementById(
      'article-grid'
    );


  if (!root) {

    return;
  }


  root.innerHTML = '';


  if (!articles.length) {

    root.innerHTML = `

      <p class="muted">

        Nessun articolo trovato.

      </p>

    `;

    return;
  }


  const fragment =
    document.createDocumentFragment();


  for (
    const article of articles
  ) {

    const card =
      document.createElement(
        'article'
      );


    card.className =
      'article-card';


    /*
       IMPORTANTISSIMO:

       href viene dal vero URL
       dell'indice.

       Non viene più creato
       partendo dal titolo.
    */

    const href =
      article.url;


    card.innerHTML = `

      <a
        class="title"
        href="${escapeHtml(href)}">

        ${highlight(
          article.title,
          query
        )}

      </a>


      <div class="url">

        ${escapeHtml(href)}

      </div>


      ${
        article.description
          ? `

            <div class="desc">

              ${highlight(
                article.description,
                query
              )}

            </div>

          `
          : ''
      }


      ${
        article.category
          ? `

            <div
              class="desc"
              style="
                opacity:.75;
                margin-top:.35rem;
              ">

              <strong>

                ${escapeHtml(
                  article.category
                )}

              </strong>

            </div>

          `
          : ''
      }

    `;


    fragment.appendChild(
      card
    );

  }


  root.appendChild(
    fragment
  );

}


/* ============================================================
   AVVIO
   ============================================================ */

(async function () {

  const root =
    document.getElementById(
      'article-grid'
    );


  try {

    /*
       1. Carica JSON
    */

    const rawItems =
      await loadIndex();


    /*
       2. Normalizza URL
    */

    const articles =
      prepareArticles(
        rawItems
      );


    console.log(
      '[Ricerca] Articoli validi:',
      articles.length
    );


    /*
       3. Categorie
    */

    const categories =
      buildCategories(
        articles
      );


    let currentCategory =
      '';


    renderCategories(
      categories,
      currentCategory
    );


    /*
       4. Messaggio iniziale
    */

    if (root) {

      root.innerHTML = `

        <p class="muted">

          Inizia a digitare per cercare
          un filosofo o un articolo.

        </p>

      `;

    }


    /*
       5. Ricerca
    */

    const input =
      document.getElementById(
        'site-search'
      );


    const clearButton =
      document.getElementById(
        'clear-search'
      );


    function executeSearch() {

      const query =
        input
          ? input.value
          : '';


      let results =
        searchArticles(
          articles,
          query
        );


      if (
        currentCategory
      ) {

        results =
          results.filter(
            article =>
              (
                article.category ||
                'Senza categoria'
              ) ===
              currentCategory
          );

      }


      if (
        query.trim()
      ) {

        renderArticles(
          results,
          query
        );

      }

      else {

        if (root) {

          root.innerHTML = `

            <p class="muted">

              Inizia a digitare per cercare
              un filosofo o un articolo.

            </p>

          `;

        }

      }


      if (clearButton) {

        clearButton.classList.toggle(
          'is-visible',
          !!query.trim()
        );

      }

    }


    if (input) {

      input.addEventListener(
        'input',
        executeSearch
      );


      input.addEventListener(
        'keydown',
        event => {

          if (
            event.key === 'Escape'
          ) {

            input.value = '';

            executeSearch();

            input.focus();

          }

        }
      );

    }


    /*
       6. Pulsante X
    */

    if (clearButton) {

      clearButton.addEventListener(
        'click',
        event => {

          event.preventDefault();

          if (input) {

            input.value = '';

            executeSearch();

            input.focus();

          }

        }
      );

    }


    /*
       7. Categorie
    */

    const categoryNav =
      document.getElementById(
        'cat-list'
      );


    if (categoryNav) {

      categoryNav.addEventListener(
        'click',
        event => {

          const button =
            event.target.closest(
              '.cat-item'
            );


          if (!button) {

            return;
          }


          currentCategory =
            button.dataset.key ||
            '';


          renderCategories(
            categories,
            currentCategory
          );


          executeSearch();

        }
      );

    }


  }

  catch (error) {

    console.error(
      '[Ricerca] Errore:',
      error
    );


    if (root) {

      root.innerHTML = `

        <p class="error">

          Impossibile caricare
          l'indice degli articoli.

        </p>

      `;

    }

  }

})();

</script>
