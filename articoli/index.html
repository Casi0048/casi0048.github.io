<!DOCTYPE html>  
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>Articoli — Echi di Sofia</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Tutti gli articoli di Echi di Sofia.">
  <link rel="icon" type="image/png" href="/favicon_io/favicon-32x32.png">

  <style>
    :root {
      --bg: #0a0a1a;
      --text: #e9eef5;
      --gold: #ffd86a;
      --gold-dim: rgba(255,216,106,.15);
      --cyan: #9ad0ff;
      --panel: rgba(10,10,30,.94);
      --border: rgba(255,215,0,.22);
      --muted: #9bb7ff;
      --radius: 14px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Inter, sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      line-height: 1.6;
      padding: 1rem;
    }
    a { color: var(--cyan); text-decoration: none; }
    a:hover { color: #fff; text-decoration: underline; }
    .wrap { max-width: 1200px; margin: 0 auto; width: 100%; }

    /* HEADER */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: .8rem 1rem;
      background: rgba(18,28,58,.96);
      border-bottom: 1px solid var(--border);
      border-radius: var(--radius) var(--radius) 0 0;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      gap: .5rem;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: .6rem;
      color: var(--gold);
      font-weight: 800;
      font-size: 1.2rem;
    }
    .brand svg { width: 28px; height: 28px; fill: none; stroke: currentColor; stroke-width: 2; }
    .brand span { background: linear-gradient(90deg,#ffd700,#fff7b0); -webkit-background-clip:text; background-clip:text; color:transparent; }

    .nav a {
      color: var(--cyan);
      padding: .4rem .8rem;
      border-radius: 8px;
      border: 1px solid rgba(0,204,255,.2);
      font-weight: 600;
      transition: all .2s;
    }
    .nav a:hover { background: rgba(0,204,255,.08); border-color: rgba(0,204,255,.5); text-decoration: none; }

    /* HERO */
    .hero { text-align: center; padding: 1rem 0 1.5rem; }
    .hero h1 { color: #ffeb9a; font-size: clamp(1.8rem, 4vw, 2.6rem); }
    .hero p { color: #cfe8ff; max-width: 60ch; margin: .2rem auto 0; }

    /* BARRA RICERCA */
    .search-box {
      display: flex;
      gap: .6rem;
      max-width: 600px;
      margin: 1rem auto;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 60px;
      padding: .2rem .2rem .2rem 1rem;
      transition: border-color .3s;
    }
    .search-box:focus-within { border-color: var(--gold); }
    .search-box input {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 1rem;
      padding: .6rem 0;
      outline: none;
    }
    .search-box input::placeholder { color: var(--muted); opacity: .7; }
    .search-box button {
      background: var(--gold);
      border: none;
      border-radius: 60px;
      padding: .5rem 1.2rem;
      font-weight: 700;
      color: #0a0a1a;
      cursor: pointer;
      transition: background .2s;
    }
    .search-box button:hover { background: #ffe08a; }

    /* FILTRI */
    .filterbar {
      display: flex;
      align-items: center;
      gap: .6rem;
      flex-wrap: wrap;
      padding: .6rem 1rem;
      background: rgba(10,10,30,.7);
      border: 1px solid rgba(255,255,255,.06);
      border-radius: var(--radius);
      margin: .5rem 0 .8rem;
    }
    .filterbar label { color: #ffeb9a; font-weight: 700; }
    .filter-select {
      background: rgba(20,20,40,.85);
      color: #e9eef5;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 8px;
      padding: .35rem .6rem;
      outline: none;
    }
    .chips { display: flex; gap: .4rem; flex-wrap: wrap; }
    .chip {
      border: 1px solid rgba(0,204,255,.25);
      background: rgba(20,20,40,.78);
      color: #9ad0ff;
      padding: .25rem .7rem;
      border-radius: 999px;
      font-weight: 600;
      font-size: .85rem;
      cursor: pointer;
      transition: all .2s;
    }
    .chip:hover { border-color: rgba(0,204,255,.5); }
    .chip.active { background: rgba(0,204,255,.12); border-color: rgba(0,204,255,.65); color: #fff; }
    .chip.reset { border-color: rgba(255,255,255,.1); color: var(--muted); }
    .chip.reset:hover { border-color: rgba(255,100,100,.4); color: #ff8a8a; }

    .view-controls {
      display: flex;
      align-items: center;
      gap: .8rem;
      flex-wrap: wrap;
      padding: .4rem 1rem;
      background: rgba(10,10,30,.5);
      border: 1px solid rgba(255,255,255,.04);
      border-radius: var(--radius);
      margin-bottom: 1rem;
    }
    .view-controls label { color: #ffeb9a; font-weight: 700; font-size: .9rem; }
    .view-toggle-btn {
      border: 1px solid rgba(0,204,255,.2);
      background: rgba(20,20,40,.78);
      color: #9ad0ff;
      padding: .3rem .6rem;
      border-radius: 6px;
      cursor: pointer;
      transition: all .2s;
    }
    .view-toggle-btn.active { background: rgba(0,204,255,.12); border-color: rgba(0,204,255,.5); color: #fff; }
    .view-toggle-btn svg { width: 16px; height: 16px; fill: currentColor; vertical-align: middle; }

    /* GRIGLIA */
    .grid { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
    .list { display: flex; flex-direction: column; gap: 1rem; }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: .4rem;
      transition: transform .2s, box-shadow .2s;
    }
    .card:hover { transform: translateY(-2px); box-shadow: 0 1rem 2.5rem rgba(0,0,0,.3); }
    .list .card { flex-direction: row; align-items: flex-start; gap: 1rem; }
    .list .card .card-content { flex: 1; }
    .card h3 { color: #ffeb9a; font-size: 1.1rem; }
    .card p { color: #cfe2ff; opacity: .9; font-size: .95rem; margin: .2rem 0; }
    .badge {
      display: inline-block;
      font-size: .7rem;
      font-weight: 800;
      padding: .1rem .5rem;
      border-radius: 999px;
      background: linear-gradient(90deg, #ffd86a, #ffeb9a);
      color: #0b1022;
      align-self: flex-start;
    }
    .more { margin-top: auto; }
    .more a { font-weight: 700; }
    .more a::after { content: " →"; transition: transform .2s; display: inline-block; }
    .more a:hover::after { transform: translateX(4px); }

    /* PAGINAZIONE */
    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: .4rem;
      flex-wrap: wrap;
      margin: 2rem 0 1rem;
    }
    .pagination button {
      border: 1px solid rgba(0,204,255,.2);
      background: rgba(20,20,40,.78);
      color: #9ad0ff;
      padding: .4rem .8rem;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: all .2s;
    }
    .pagination button:hover:not(:disabled) { background: rgba(0,204,255,.08); border-color: rgba(0,204,255,.5); }
    .pagination button:disabled { opacity: .4; cursor: not-allowed; }
    .pagination button.active-page { border-color: var(--gold); color: var(--gold); background: rgba(255,216,106,.08); }
    .pagination-info { color: var(--muted); font-size: .9rem; }

    /* EVIDENZIAZIONE RICERCA */
    mark {
      background: rgba(173,216,230,.5);
      color: #1a3a4a;
      padding: .05rem .25rem;
      border-radius: 4px;
      font-weight: 700;
    }

    /* STATO VUOTO */
    .empty { text-align: center; padding: 2rem 0; color: var(--muted); }

    footer {
      margin-top: auto;
      padding: 1.5rem 0 .5rem;
      text-align: center;
      color: var(--muted);
      border-top: 1px solid rgba(255,255,255,.04);
    }

    /* RESPONSIVE */
    @media (max-width: 640px) {
      .topbar { flex-direction: column; align-items: stretch; text-align: center; }
      .nav { justify-content: center; }
      .filterbar, .view-controls { flex-direction: column; align-items: stretch; }
      .filterbar .meta { text-align: right; }
      .grid { grid-template-columns: 1fr; }
      .list .card { flex-direction: column; }
      .search-box { flex-wrap: wrap; border-radius: 20px; padding: .5rem; }
      .search-box button { width: 100%; }
    }
  </style>
</head>
<body>

<div class="wrap">

  <!-- TOPBAR -->
  <div class="topbar">
    <a class="brand" href="/">
      <svg viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
      <span>Echi di Sofia</span>
    </a>
    <div class="nav">
      <a href="/">🏠 Home</a>
      <a href="/filosofia/">📚 Filosofia</a>
      <a href="/articoli/" style="background:rgba(0,204,255,.12);border-color:rgba(0,204,255,.6);color:#fff;text-decoration:none;">📖 Articoli</a>
    </div>
  </div>

  <!-- HERO -->
  <div class="hero">
    <h1>Articoli e Approfondimenti</h1>
    <p>Esplora tutti i contenuti pubblicati su Echi di Sofia.</p>
  </div>

  <!-- RICERCA -->
  <div class="search-box" role="search">
    <input type="text" id="searchInput" placeholder="Cerca articoli…" aria-label="Cerca negli articoli">
    <button id="clearSearchBtn" style="background:transparent;color:var(--muted);padding:.5rem;font-size:1.1rem;display:none;">✕</button>
    <button id="searchBtn">Cerca</button>
  </div>

  <!-- FILTRI -->
  <div class="filterbar" id="filterbar">
    <label for="filterSelect">Categoria:</label>
    <select id="filterSelect" class="filter-select"></select>
    <div class="chips" id="chipsContainer"></div>
    <div style="margin-left:auto;color:var(--muted);font-size:.9rem;" id="resultCount">0 articoli</div>
  </div>

  <!-- CONTROLLI VISTA -->
  <div class="view-controls">
    <label for="sortSelect">Ordina per:</label>
    <select id="sortSelect" class="filter-select">
      <option value="title">Titolo (A-Z)</option>
      <option value="title-desc">Titolo (Z-A)</option>
      <option value="category">Categoria</option>
    </select>
    <div class="view-toggle">
      <button class="view-toggle-btn active" id="viewGrid" aria-label="Griglia">
        <svg viewBox="0 0 16 16"><rect x="1" y="1" width="6" height="6" rx="1"/><rect x="9" y="1" width="6" height="6" rx="1"/><rect x="1" y="9" width="6" height="6" rx="1"/><rect x="9" y="9" width="6" height="6" rx="1"/></svg>
      </button>
      <button class="view-toggle-btn" id="viewList" aria-label="Lista">
        <svg viewBox="0 0 16 16"><rect x="1" y="1" width="14" height="2" rx="1"/><rect x="1" y="7" width="14" height="2" rx="1"/><rect x="1" y="13" width="14" height="2" rx="1"/></svg>
      </button>
    </div>
  </div>

  <!-- RISULTATI -->
  <div id="articlesContainer" class="grid" role="list"></div>

  <!-- PAGINAZIONE -->
  <div class="pagination" id="pagination"></div>

  <footer>© 2026 Echi di Sofia</footer>

</div>

<script>
  (function() {
    'use strict';

    // ============================================================
    // DATI DEGLI ARTICOLI (inline – sostituisci con i tuoi)
    // ============================================================
    const ARTICLES = [
      { title: "Il mito della caverna di Platone", category: "Antica", description: "Un'analisi approfondita del celebre mito platonico." },
      { title: "L'etica nicomachea di Aristotele", category: "Antica", description: "La felicità come fine ultimo dell'uomo." },
      { title: "Meditazioni di Marco Aurelio", category: "Romana", description: "Il diario filosofico dell'imperatore stoico." },
      { title: "Il nominalismo di Guglielmo di Ockham", category: "Medievale", description: "Il rasoio di Ockham e la filosofia del linguaggio." },
      { title: "Il Discorso sul metodo di Cartesio", category: "Moderna", description: "Il fondamento della filosofia moderna." },
      { title: "La Critica della ragion pura di Kant", category: "Moderna", description: "I limiti della conoscenza umana." },
      { title: "Così parlò Zarathustra di Nietzsche", category: "Contemporanea", description: "Il superuomo e la morte di Dio." },
      { title: "L'Essere e il nulla di Sartre", category: "Contemporanea", description: "L'esistenzialismo e la libertà radicale." },
      { title: "Stoicismo: l'arte di vivere", category: "Romana", description: "I principi dello stoicismo per una vita serena." },
      { title: "Il Timeo di Platone", category: "Antica", description: "Il dialogo platonico sulla creazione del mondo." },
      { title: "Le Confessioni di Agostino", category: "Medievale", description: "L'interiorità e il tempo in Agostino." },
      { title: "Il Principe di Machiavelli", category: "Moderna", description: "La politica e il potere." },
      { title: "La fenomenologia dello spirito di Hegel", category: "Contemporanea", description: "La dialettica del riconoscimento." },
      { title: "Pensieri di Pascal", category: "Moderna", description: "L'uomo tra grandezza e miseria." },
      { title: "Epicuro e la felicità", category: "Antica", description: "Il giardino e l'atarassia." },
    ];

    // ============================================================
    // STATO
    // ============================================================
    let data = ARTICLES.slice();
    let currentFilter = '';
    let currentSort = 'title';
    let currentView = 'grid';
    let currentPage = 1;
    const perPage = 9;

    // ============================================================
    // DOM REFS
    // ============================================================
    const container = document.getElementById('articlesContainer');
    const filterSelect = document.getElementById('filterSelect');
    const chipsContainer = document.getElementById('chipsContainer');
    const sortSelect = document.getElementById('sortSelect');
    const viewGrid = document.getElementById('viewGrid');
    const viewList = document.getElementById('viewList');
    const pagination = document.getElementById('pagination');
    const resultCount = document.getElementById('resultCount');
    const searchInput = document.getElementById('searchInput');
    const searchBtn = document.getElementById('searchBtn');
    const clearBtn = document.getElementById('clearSearchBtn');

    let searchTerm = '';

    // ============================================================
    // UTILITY
    // ============================================================
    function normalize(str) {
      return (str || '').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function highlight(text, term) {
      if (!term || !text) return escapeHtml(text);
      const tokens = normalize(term).split(/\s+/).filter(Boolean);
      if (!tokens.length) return escapeHtml(text);
      let result = escapeHtml(text);
      for (const t of tokens) {
        if (t.length < 2) continue;
        const re = new RegExp('(' + t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
        result = result.replace(re, '<mark>$1</mark>');
      }
      return result;
    }

    // ============================================================
    // FUNZIONI PRINCIPALI
    // ============================================================
    function getCategories() {
      const map = new Map();
      for (const a of data) {
        const cat = a.category || 'Altro';
        map.set(cat, (map.get(cat) || 0) + 1);
      }
      return Array.from(map.entries()).sort((a, b) => a[0].localeCompare(b[0]));
    }

    function getFilteredData() {
      let result = data;
      if (searchTerm) {
        const q = normalize(searchTerm);
        result = result.filter(a => {
          const t = normalize(a.title);
          const d = normalize(a.description || '');
          return t.includes(q) || d.includes(q);
        });
      }
      if (currentFilter) {
        result = result.filter(a => (a.category || 'Altro') === currentFilter);
      }
      // Sort
      switch (currentSort) {
        case 'title-desc':
          result.sort((a, b) => (b.title || '').localeCompare(a.title || ''));
          break;
        case 'category':
          result.sort((a, b) => ((a.category || 'Altro') + a.title).localeCompare((b.category || 'Altro') + b.title));
          break;
        default:
          result.sort((a, b) => (a.title || '').localeCompare(b.title || ''));
          break;
      }
      return result;
    }

    function render() {
      const filtered = getFilteredData();
      const total = filtered.length;
      const totalPages = Math.max(1, Math.ceil(total / perPage));
      if (currentPage > totalPages) currentPage = totalPages;

      const start = (currentPage - 1) * perPage;
      const end = Math.min(start + perPage, total);
      const pageItems = filtered.slice(start, end);

      // Aggiorna contatore
      resultCount.textContent = `${total} articolo${total !== 1 ? 'i' : ''}`;

      // Renderizza
      const isList = currentView === 'list';
      container.className = isList ? 'list' : 'grid';

      if (pageItems.length === 0) {
        container.innerHTML = `<div class="empty">Nessun articolo trovato.</div>`;
      } else {
        container.innerHTML = pageItems.map(a => {
          const cat = a.category || 'Altro';
          const titleHtml = highlight(a.title, searchTerm);
          const descHtml = a.description ? highlight(a.description, searchTerm) : '';
          const link = `/articoli/${a.title.toLowerCase().replace(/\s+/g, '-')}.html`; // placeholder
          if (isList) {
            return `<article class="card" role="listitem">
              <span class="badge">${escapeHtml(cat)}</span>
              <div class="card-content">
                <h3>${titleHtml}</h3>
                ${descHtml ? `<p>${descHtml}</p>` : ''}
                <div class="more"><a href="${link}">Leggi</a></div>
              </div>
            </article>`;
          } else {
            return `<article class="card" role="listitem">
              <span class="badge">${escapeHtml(cat)}</span>
              <h3>${titleHtml}</h3>
              ${descHtml ? `<p>${descHtml}</p>` : ''}
              <div class="more"><a href="${link}">Leggi</a></div>
            </article>`;
          }
        }).join('');
      }

      // Paginazione
      pagination.innerHTML = '';
      if (totalPages > 1) {
        const prev = document.createElement('button');
        prev.textContent = '‹';
        prev.disabled = currentPage <= 1;
        prev.addEventListener('click', () => goToPage(currentPage - 1));
        pagination.appendChild(prev);

        const pages = document.createElement('span');
        pages.style.display = 'flex';
        pages.style.gap = '.3rem';
        const maxVisible = 5;
        let startP = Math.max(1, currentPage - Math.floor(maxVisible / 2));
        let endP = Math.min(totalPages, startP + maxVisible - 1);
        if (endP - startP < maxVisible - 1) startP = Math.max(1, endP - maxVisible + 1);

        if (startP > 1) {
          const b = document.createElement('button');
          b.textContent = '1';
          b.addEventListener('click', () => goToPage(1));
          pages.appendChild(b);
          if (startP > 2) { const e = document.createElement('span'); e.textContent = '…'; e.style.color = 'var(--muted)'; pages.appendChild(e); }
        }
        for (let i = startP; i <= endP; i++) {
          const b = document.createElement('button');
          b.textContent = i;
          if (i === currentPage) b.classList.add('active-page');
          b.addEventListener('click', () => goToPage(i));
          pages.appendChild(b);
        }
        if (endP < totalPages) {
          if (endP < totalPages - 1) { const e = document.createElement('span'); e.textContent = '…'; e.style.color = 'var(--muted)'; pages.appendChild(e); }
          const b = document.createElement('button');
          b.textContent = totalPages;
          b.addEventListener('click', () => goToPage(totalPages));
          pages.appendChild(b);
        }
        pagination.appendChild(pages);

        const next = document.createElement('button');
        next.textContent = '›';
        next.disabled = currentPage >= totalPages;
        next.addEventListener('click', () => goToPage(currentPage + 1));
        pagination.appendChild(next);
      }

      // Aggiorna URL
      updateURL();
    }

    function goToPage(p) {
      const total = getFilteredData().length;
      const max = Math.max(1, Math.ceil(total / perPage));
      if (p < 1 || p > max) return;
      currentPage = p;
      render();
      container.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    // ============================================================
    // FILTRI UI
    // ============================================================
    function buildFilters() {
      const cats = getCategories();
      // Select
      filterSelect.innerHTML = `<option value="">Tutte</option>` +
        cats.map(([c, count]) =>
          `<option value="${c}"${c === currentFilter ? ' selected' : ''}>${c} (${count})</option>`
        ).join('');

      // Chips
      chipsContainer.innerHTML = `
        <button class="chip${!currentFilter ? ' active' : ''}" data-cat="">Tutte</button>
        ${cats.map(([c, count]) =>
          `<button class="chip${c === currentFilter ? ' active' : ''}" data-cat="${c}">${c} (${count})</button>`
        ).join('')}
        <button class="chip reset" data-cat="reset">✕ Cancella</button>
      `;
      chipsContainer.querySelectorAll('.chip').forEach(btn => {
        btn.addEventListener('click', () => {
          const val = btn.getAttribute('data-cat');
          if (val === 'reset') setFilter('');
          else setFilter(val);
        });
      });
    }

    // ============================================================
    // SETTER DI STATO
    // ============================================================
    function setFilter(cat, pushState = true) {
      currentFilter = cat || '';
      currentPage = 1;
      filterSelect.value = cat;
      buildFilters(); // aggiorna active
      render();
      if (pushState) updateURL();
    }

    function setSort(sort, pushState = true) {
      currentSort = sort || 'title';
      sortSelect.value = sort;
      render();
      if (pushState) updateURL();
    }

    function setView(view, pushState = true) {
      currentView = view || 'grid';
      viewGrid.classList.toggle('active', view === 'grid');
      viewList.classList.toggle('active', view === 'list');
      render();
      if (pushState) updateURL();
    }

    // ============================================================
    // URL STATE
    // ============================================================
    function updateURL() {
      const params = new URLSearchParams();
      if (currentFilter) params.set('cat', currentFilter);
      if (currentSort !== 'title') params.set('sort', currentSort);
      if (currentView !== 'grid') params.set('view', currentView);
      if (currentPage > 1) params.set('page', currentPage);
      if (searchTerm) params.set('q', searchTerm);
      const url = window.location.pathname + (params.toString() ? '?' + params.toString() : '');
      history.replaceState({ cat: currentFilter, sort: currentSort, view: currentView, page: currentPage, q: searchTerm }, '', url);
    }

    function restoreFromURL() {
      const params = new URLSearchParams(window.location.search);
      const cat = params.get('cat') || '';
      const sort = params.get('sort') || 'title';
      const view = params.get('view') || 'grid';
      const page = parseInt(params.get('page'), 10) || 1;
      const q = params.get('q') || '';
      if (cat) currentFilter = cat;
      currentSort = sort;
      currentView = view;
      currentPage = page;
      searchTerm = q;
      searchInput.value = q;
      if (q) clearBtn.style.display = 'block';
      else clearBtn.style.display = 'none';
      sortSelect.value = sort;
      viewGrid.classList.toggle('active', view === 'grid');
      viewList.classList.toggle('active', view === 'list');
      // I filtri verranno applicati dopo il render
    }

    // ============================================================
    // RICERCA
    // ============================================================
    function performSearch() {
      const q = searchInput.value.trim();
      searchTerm = q;
      currentPage = 1;
      clearBtn.style.display = q ? 'block' : 'none';
      render();
      updateURL();
    }

    searchInput.addEventListener('input', performSearch);
    searchBtn.addEventListener('click', performSearch);
    searchInput.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); performSearch(); } });
    clearBtn.addEventListener('click', () => {
      searchInput.value = '';
      performSearch();
      searchInput.focus();
    });

    // ============================================================
    // EVENTI UI
    // ============================================================
    filterSelect.addEventListener('change', () => setFilter(filterSelect.value, true));
    sortSelect.addEventListener('change', () => setSort(sortSelect.value, true));
    viewGrid.addEventListener('click', () => setView('grid', true));
    viewList.addEventListener('click', () => setView('list', true));

    window.addEventListener('popstate', (e) => {
      const state = e.state || {};
      if (state.cat !== undefined) currentFilter = state.cat;
      if (state.sort) currentSort = state.sort;
      if (state.view) currentView = state.view;
      if (state.page) currentPage = state.page;
      if (state.q !== undefined) {
        searchTerm = state.q || '';
        searchInput.value = searchTerm;
        clearBtn.style.display = searchTerm ? 'block' : 'none';
      }
      buildFilters();
      render();
    });

    // ============================================================
    // AVVIO
    // ============================================================
    restoreFromURL();
    buildFilters();
    render();

  })();
</script>

</body>
</html>
