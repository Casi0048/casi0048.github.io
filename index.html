    <style>
      /* ============================================================
   ROOT — TEMA SCURO (DEFAULT)
   ============================================================ */

:root {
    --bg: #080a12;
    --bg-soft: #0d101a;
    --surface: rgba(255,255,255,.035);
    --surface-hover: rgba(255,255,255,.055);

    --text: #D9FBE8;
    --text-soft: #A8D8BB;
    --text-muted: #789987;

    --gold: #45E6A1;
    --gold-soft: rgba(69,230,161,.16);
    --gold-line: rgba(69,230,161,.24);

    --border: rgba(255,255,255,.08);

    --serif: "Cormorant Garamond", Georgia, serif;
    --display: "Cinzel", Georgia, serif;
    --sans: "Inter", Arial, sans-serif;

    --radius: 14px;

    --transition:
        .28s cubic-bezier(.22,1,.36,1);

    /* Colori per il pulsante torna su */
    --torna-su-bg: var(--gold);
    --torna-su-color: var(--bg);
    --torna-su-shadow: rgba(69,230,161,0.30);
}

/* ============================================================
   TEMA CHIARO
   ============================================================ */

body.light-theme {
    /* Sfondo */
    --bg: #eaf2ed;
    --bg-soft: #dce8e0;

    /* Testi – scuri e decisi */
    --text: #0f1f16;
    --text-soft: #1a3628;
    --text-muted: #3a5a48;

    /* Accenti – verde smeraldo brillante */
    --gold: #00a86b;
    --gold-soft: rgba(0, 168, 107, 0.10);
    --gold-line: rgba(0, 168, 107, 0.25);

    /* Superfici e bordi */
    --border: rgba(0, 0, 0, 0.06);
    --surface: rgba(0, 168, 107, 0.04);
    --surface-hover: rgba(0, 168, 107, 0.08);

    /* Pulsante torna su */
    --torna-su-bg: #00a86b;
    --torna-su-color: #eaf2ed;
    --torna-su-shadow: rgba(0, 168, 107, 0.3);
}

/* ============================================================
  IMPOSTAZIONE COLORI DI PLAYER SU TEMA CHIARO
   ============================================================ */
body.light-theme .music-panel {
    background: rgba(242, 237, 229, 0.97);
    border-color: rgba(0, 168, 107, 0.18);
}

body.light-theme .music-title {
    color: #0f1f16;
}

body.light-theme .music-label {
    color: #3a5a48;
}

body.light-theme .music-close {
    color: rgba(0, 0, 0, 0.45);
}

body.light-theme .music-close:hover {
    color: #0f1f16;
}

body.light-theme .music-play,
body.light-theme .music-volume,
body.light-theme .music-next {
    color: #00a86b;
}

body.light-theme .music-next {
    border-color: rgba(0, 168, 107, 0.3);
}

body.light-theme .music-next:hover {
    background: rgba(0, 168, 107, 0.1);
    border-color: #00a86b;
}

body.light-theme .music-progress {
    background: rgba(0, 0, 0, 0.12);
}

body.light-theme .music-progress::-webkit-slider-thumb {
    background: #00a86b;
}

body.light-theme .music-progress::-moz-range-thumb {
    background: #00a86b;
}

body.light-theme .player-status {
    color: #4a6a5a;
}

/* ============================================================
   PULSANTE "BRANO SUCCESSIVO" — tema scuro (default)
   ============================================================ */
.music-next {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 34px;
    height: 34px;
    background: transparent;
    border: 1px solid rgba(212, 165, 116, 0.35);
    border-radius: 50%;
    color: var(--gold, #d4a574);
    font-size: 1rem;
    cursor: pointer;
    transition: background .3s ease, color .3s ease, border-color .3s ease;
}
.music-next:hover {
    background: rgba(212, 165, 116, 0.12);
    border-color: var(--gold, #d4a574);
}

.resource h3 {
    font-family: var(--display);
    font-size: 1.05rem;
    font-weight: 500;

    margin-bottom: 8px;

    color: #03C03C !important;

    transition: color 0.4s ease;
}

.resource p {
    font-family: var(--serif);
    font-size: 1rem;

    color: var(--text-soft);

    transition: color .4s ease;
}

/* ============================================================
   RESET & BASE
   ============================================================ */
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}
html {
    scroll-behavior: smooth;
    background: var(--bg);
}
body {
    min-height: 100vh;
    background: radial-gradient(circle at 50% -10%, rgba(91, 104, 145, .10), transparent 42%), var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-weight: 400;
    line-height: 1.6;
    overflow-x: hidden;
    transition: background .4s ease, color .4s ease;
    text-shadow: 0 0 2px rgba(0, 0, 0, .15);
}

main {
    position: relative;
    z-index: 1;
}

a {
    color: inherit;
    text-decoration: none;
}
button,
input {
    font: inherit;
}

.container {
    width: min(1180px, calc(100% - 48px));
    margin: 0 auto;
}

/* ============================================================
   SFONDO COSMICO — ACCESSIBILITÀ
   Rispetta le preferenze di chi disattiva le animazioni
   ============================================================ */
@media (prefers-reduced-motion: reduce) {
    .twinkling-stars animate,
    .shooting-stars animate,
    .shooting-stars animateTransform,
    .sky-lightning animate {
        display: none;
    }
}
