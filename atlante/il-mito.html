
<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Scheda in preparazione — Atlante delle Idee · Echi di Sofia</title>
  <meta name="description" content="La scheda di questo concetto filosofico è in preparazione. Esplora l'Atlante delle Idee nel frattempo.">
  <meta name="robots" content="noindex,follow">
  <meta name="theme-color" content="#080a12">
  <link rel="icon" type="image/svg+xml" href="/favicon_io/favicon.svg">
  <style>
    :root{
      --bg:#080a12;--bg-soft:#0d101a;
      --text:#d9fbe8;--text-soft:#a8d8bb;--text-muted:#8eb5a1;
      --gold:#EFBF04;--gold-soft:rgba(239,191,4,.16);--gold-line:rgba(239,191,4,.24);
      --border:rgba(255,255,255,.08);
      --serif:"Cormorant Garamond",Georgia,serif;
      --display:"Cinzel",Georgia,serif;
      --sans:"Inter",Arial,sans-serif;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{
      min-height:100vh;background:var(--bg);color:var(--text);
      font-family:var(--sans);line-height:1.6;
      display:flex;flex-direction:column;
    }
    a{color:inherit;text-decoration:none}
    .wrap{width:min(720px,calc(100% - 40px));margin:0 auto;padding:48px 0;flex:1;
      display:flex;flex-direction:column;justify-content:center}
    .badge{
      display:inline-block;margin-bottom:24px;padding:5px 14px;
      border:1px solid var(--gold-line);border-radius:100px;
      font-size:.66rem;letter-spacing:2.2px;text-transform:uppercase;
      color:var(--gold);background:var(--gold-soft);
      width:fit-content;
    }
    h1{
      font-family:var(--display);font-weight:500;
      font-size:clamp(2rem,5vw,3rem);letter-spacing:2px;
      line-height:1.1;color:var(--text);margin-bottom:16px;
    }
    h1 em{
      display:block;margin-top:8px;
      font-family:var(--serif);font-style:italic;font-weight:500;
      font-size:.55em;letter-spacing:.5px;color:var(--gold);opacity:.9;
    }
    .lead{
      font-family:var(--serif);font-size:1.15rem;font-style:italic;
      line-height:1.7;color:var(--text-soft);margin-bottom:36px;
    }
    .lead::before{content:"« ";color:var(--gold);opacity:.5}
    .lead::after{content:" »";color:var(--gold);opacity:.5}
    .actions{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:36px}
    .btn{
      display:inline-flex;align-items:center;gap:8px;
      padding:11px 22px;border-radius:100px;
      font-family:var(--sans);font-size:.78rem;
      letter-spacing:1.2px;text-transform:uppercase;
      transition:all .3s cubic-bezier(.16,1,.3,1);
    }
    .btn-primary{
      background:var(--gold);color:var(--bg);border:1px solid var(--gold);
    }
    .btn-primary:hover{
      filter:brightness(1.08);transform:translateY(-2px);
      box-shadow:0 6px 20px var(--gold-soft);
    }
    .btn-secondary{
      background:transparent;color:var(--gold);
      border:1px solid var(--gold-line);
    }
    .btn-secondary:hover{
      background:var(--gold-soft);border-color:var(--gold);
    }
    .related{
      margin-top:36px;padding-top:28px;
      border-top:1px solid var(--gold-line);
    }
    .related h2{
      font-family:var(--display);font-size:.72rem;font-weight:500;
      letter-spacing:2.5px;text-transform:uppercase;
      color:var(--gold);margin-bottom:16px;
    }
    .related ul{list-style:none;display:flex;flex-direction:column;gap:8px}
    .related li a{
      display:flex;align-items:center;gap:10px;
      padding:10px 14px;border-radius:8px;
      font-family:var(--serif);font-size:1rem;
      color:var(--text-soft);
      border:1px solid transparent;
      transition:all .25s;
    }
    .related li a:hover{
      border-color:var(--gold-line);background:var(--gold-soft);
      color:var(--gold);padding-left:18px;
    }
    .related li a::before{
      content:"→";color:var(--gold);opacity:.6;font-size:.9rem;
    }
    .footer{
      padding:24px 0;text-align:center;
      font-size:.68rem;letter-spacing:.6px;
      color:var(--text-muted);
      border-top:1px solid var(--border);
    }
    .footer a{color:var(--gold)}
    .footer a:hover{text-decoration:underline}
  </style>
</head>
<body>
  <div class="wrap">
    <span class="badge" id="regione">Atlante delle Idee</span>
    <h1>
      <span id="titolo">Scheda in preparazione</span>
      <em id="originale"></em>
    </h1>
    <p class="lead" id="anteprima">
      Stiamo lavorando a questa scheda. Nel frattempo esplora l'Atlante completo
      o leggi uno degli articoli correlati.
    </p>

    <div class="actions">
      <a class="btn btn-primary" href="/atlante/index.html">✦ Torna all'Atlante</a>
      <a class="btn btn-secondary" href="/">Vai alla Home</a>
    </div>

    <div class="related" id="related" hidden>
      <h2>Approfondimenti correlati</h2>
      <ul id="relatedList"></ul>
    </div>
  </div>

  <footer class="footer">
    © 2026 Echi di Sofia · <a href="/pagine/pagina-contatti.html">Contatti</a>
  </footer>

  <script>
    /* Legge lo slug dall'URL e popola il contenuto */
    (function(){
      const slug = location.pathname.replace(/^.*\//, '').replace(/\.html$/, '');
      const MAPPA = {
        'bene':       { titolo:'Bene',         originale:'Agathón',              regione:'Ontologia e Metafisica',     articoli:[['Platonismo — articolo','/articoli/platonismo.html'],['Filosofia antica — panorama','/filosofia/antica.html']] },
        'verita':     { titolo:'Verità',       originale:'Alétheia',             regione:'Ontologia e Metafisica',     articoli:[['Filosofia classica — Platone e Aristotele','/filosofia/classica.html']] },
        'il-simulacro':{titolo:'Il Simulacro', originale:'Simulacrum',           regione:'Ontologia e Metafisica',     articoli:[['Filosofia contemporanea — Baudrillard','/filosofia/contemporanea.html']] },
        'dio':        { titolo:'Dio',          originale:'Deus',                 regione:'Ontologia e Metafisica',     articoli:[['Filosofia medievale','/filosofia/medievale.html']] },
        'il-dubbio':  { titolo:'Il Dubbio',    originale:'Dubium',               regione:'Epistemologia e Mente',      articoli:[['Filosofia moderna — Descartes','/filosofia/moderna.html']] },
        'la-coscienza':{titolo:'La Coscienza', originale:'Conscientia',          regione:'Epistemologia e Mente',      articoli:[['Filosofia contemporanea — mente','/filosofia/contemporanea.html']] },
        'liberta':    { titolo:'Libertà',      originale:'Libertas',             regione:'Etica e Morale',             articoli:[['Stoicismo — articolo','/articoli/stoicismo.html'],['Filosofia moderna — Spinoza e Kant','/filosofia/moderna.html']] },
        'la-virtu':   { titolo:'La Virtù',     originale:'Areté',                regione:'Etica e Morale',             articoli:[['Filosofia classica — Aristotele','/filosofia/classica.html']] },
        'il-male':    { titolo:'Il Male',      originale:'Malum',                regione:'Etica e Morale',             articoli:[['Filosofia medievale — Agostino','/filosofia/medievale.html']] },
        'la-giustizia':{titolo:'La Giustizia', originale:'Iustitia',             regione:'Politica e Società',         articoli:[['Filosofia classica — Platone','/filosofia/classica.html']] },
        'la-democrazia':{titolo:'La Democrazia',originale:'Demokratía',          regione:'Politica e Società',         articoli:[['Filosofia antica — Atene','/filosofia/antica.html']] },
        'il-bello':   { titolo:'Il Bello',     originale:'Kalón',                regione:'Estetica e Cultura',         articoli:[['Filosofia classica — Platone','/filosofia/classica.html']] },
        'il-sublime': { titolo:'Il Sublime',   originale:'Sublimis',             regione:'Estetica e Cultura',         articoli:[['Filosofia moderna — Kant','/filosofia/moderna.html']] },
        'il-mito':    { titolo:'Il Mito',      originale:'Mythos',               regione:'Estetica e Cultura',         articoli:[['Filosofia antica — mythos e logos','/filosofia/antica.html']] },
        'anima':      { titolo:'Anima',        originale:'Psyché',               regione:'Esistenza e Antropologia',   articoli:[['Filosofia antica — anima platonica','/filosofia/antica.html']] },
        'il-tempo':   { titolo:'Il Tempo',     originale:'Chrónos',              regione:'Esistenza e Antropologia',   articoli:[['Filosofia contemporanea — Heidegger','/filosofia/contemporanea.html']] },
        'l-amore':    { titolo:'L\'Amore',     originale:'Eros',                 regione:'Esistenza e Antropologia',   articoli:[['Filosofia classica — Platone','/filosofia/classica.html']] }
      };
      const info = MAPPA[slug];
      if (!info) return;
      document.getElementById('titolo').textContent = info.titolo;
      document.getElementById('originale').textContent = info.originale ? '(' + info.originale + ')' : '';
      document.getElementById('regione').textContent = info.regione;
      document.title = info.titolo + ' — in preparazione · Atlante delle Idee';
      if (info.articoli && info.articoli.length) {
        const list = document.getElementById('relatedList');
        list.innerHTML = info.articoli.map(([label, href]) =>
          '<li><a href="' + href + '">' + label + '</a></li>'
        ).join('');
        document.getElementById('related').hidden = false;
      }
    })();
  </script>
</body>
</html>
