<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="eGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D9FBE8"/>
      <stop offset="55%" stop-color="#45E6A1"/>
      <stop offset="100%" stop-color="#45E6A1"/>
    </linearGradient>
  </defs>

  <!-- Sfondo notturno, angoli arrotondati -->
  <rect width="64" height="64" rx="14" fill="#080a12"/>

  <!-- Bordo sottile emerald -->
  <rect x="1" y="1" width="62" height="62" rx="13"
        fill="none" stroke="#45E6A1" stroke-opacity="0.22" stroke-width="1"/>

  <!-- Tre onde d'eco sfalsate -->
  <g fill="none" stroke="#45E6A1">
    <circle cx="32" cy="32" r="8">
      <animate attributeName="r" values="8;30" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.75;0" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="stroke-width" values="1.4;0.2" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="32" cy="32" r="8">
      <animate attributeName="r" values="8;30" dur="3s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.75;0" dur="3s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="stroke-width" values="1.4;0.2" dur="3s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="32" cy="32" r="8">
      <animate attributeName="r" values="8;30" dur="3s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.75;0" dur="3s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="stroke-width" values="1.4;0.2" dur="3s" begin="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- La lettera E, che pulsa dolcemente -->
  <g transform="translate(32,32)">
    <g>
      <animateTransform attributeName="transform" type="scale"
                        values="1;1.06;1" dur="3s" repeatCount="indefinite"/>
      <g transform="translate(-32,-32)">
        <g fill="url(#eGrad)">
          <rect x="14" y="12" width="6.5" height="40"/>
          <rect x="14" y="12" width="36" height="6.5"/>
          <rect x="14" y="28.75" width="30" height="6.5"/>
          <rect x="14" y="45.5" width="36" height="6.5"/>
        </g>
      </g>
    </g>
  </g>
</svg>
