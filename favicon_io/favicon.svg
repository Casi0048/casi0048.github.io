<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="eGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D9FBE8"/>
      <stop offset="55%" stop-color="#45E6A1"/>
      <stop offset="100%" stop-color="#45E6A1"/>
    </linearGradient>
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#D9FBE8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#45E6A1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="#080a12"/>
  <rect x="1" y="1" width="62" height="62" rx="13"
        fill="none" stroke="#45E6A1" stroke-opacity="0.22" stroke-width="1"/>
  <circle cx="32" cy="32" r="22" fill="none"
          stroke="#45E6A1" stroke-opacity="0.18" stroke-width="1"/>

  <!-- Alone della stella -->
  <circle cx="45" cy="31.5" r="7.5" fill="url(#starGlow)" opacity="0.55"/>

  <g fill="none" stroke="url(#eGrad)" stroke-linecap="round">
    <!-- Gamba verticale a S -->
    <path d="M 21 13 C 17 22, 23 42, 19 51" stroke-width="8"/>

    <!-- Braccio superiore -->
    <path d="M 21 13 C 27 16, 39 10, 50 14" stroke-width="7.5"/>

    <!-- Braccio centrale: si ferma prima della stella -->
    <path d="M 20 32 C 26 30, 31 33, 37 31.5" stroke-width="7.5"/>

    <!-- Braccio inferiore -->
    <path d="M 19 51 C 27 48, 39 54, 50 50" stroke-width="7.5"/>
  </g>

  <!-- Stella a quattro punte -->
  <path fill="#FFFFFF" d="M 45 25.5 L 46.4 30.1 L 51 31.5 L 46.4 32.9 L 45 37.5 L 43.6 32.9 L 39 31.5 L 43.6 30.1 Z"/>
</svg>
