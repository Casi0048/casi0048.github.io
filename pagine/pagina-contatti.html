<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contatti — Echi di Sofia</title>

    <!-- ==================== FAVICONS & MANIFEST (PWA READY) ==================== -->
    <link rel="icon" type="image/svg+xml" href="/favicon_io/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon_io/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon_io/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon_io/apple-touch-icon.png">
    <link rel="manifest" href="/favicon_io/site.webmanifest">
    <meta name="theme-color" content="#0b0f19">
    <meta name="msapplication-TileColor" content="#0b0f19">

    <!-- ============================================================
         FONT AWESOME
         ============================================================ -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- ============================================================
         GOOGLE FONTS
         ============================================================ -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        /* ============================================================
           VARIABILI (come nelle altre pagine)
           ============================================================ */
        :root {
            --bg: #080a12;
            --bg-soft: #0d101a;
            --text: #e8e7e2;
            --text-soft: #a9abb5;
            --text-muted: #737681;
            --gold: #d8b56a;
            --gold-line: rgba(216,181,106,0.22);
            --border: rgba(255,255,255,0.08);
            --transition: .28s cubic-bezier(.22,1,.36,1);
            --font-serif: 'Cormorant Garamond', Georgia, serif;
            --font-display: 'Cinzel', Georgia, serif;
            --font-sans: 'Inter', Arial, sans-serif;
        }

        body.light-theme {
            --bg: #f2ede5;
            --bg-soft: #e8e2d8;
            --text: #1a1a2e;
            --text-soft: #3a3a4e;
            --text-muted: #6a6a7e;
            --gold: #b8860b;
            --gold-line: rgba(184,134,11,0.25);
            --border: rgba(0,0,0,0.08);
        }

        /* ============================================================
           RESET & BASE
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            font-family: 'Inter', Arial, sans-serif;
            background: #080a12;
            color: #e8e7e2;
            background-image: radial-gradient(circle at 50% -10%, rgba(91, 104, 145, 0.10), transparent 42%);
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        /* ============================================================
           HEADER
           ============================================================ */
        .site-header {
            position: relative;
            z-index: 20;
            border-bottom: 1px solid rgba(255, 255, 255, 0.055);
            background: rgba(8, 10, 18, 0.88);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            padding: 0 20px;
        }

        .header-inner {
            max-width: 1180px;
            margin: 0 auto;
            min-height: 76px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 30px;
        }

        /* ===== BACK BUTTON ===== */
        .back-link {
            color: #d8b56a;
            font-size: 1rem;
            font-weight: 500;
            letter-spacing: 0.04em;
            text-decoration: none;
            opacity: 0.9;
            transition: color 0.25s ease, opacity 0.25s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .back-link:hover {
            color: #fff;
            opacity: 1;
        }

        .back-link i {
            font-size: 0.9rem;
        }

        /* ===== LOGO ===== */
        .logo {
            font-family: 'Cinzel', Georgia, serif;
            font-size: 1rem;
            font-weight: 500;
            letter-spacing: 2px;
            color: #d8b56a;
            white-space: nowrap;
            transition: color 0.4s ease;
        }

        .logo-sub {
            display: block;
            margin-top: 2px;
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: 0.78rem;
            font-style: italic;
            letter-spacing: 0.4px;
            color: #737681;
            transition: color 0.4s ease;
        }

        /* ============================================================
           CONTENUTO PRINCIPALE
           ============================================================ */
        .main-content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .contact-container {
            display: grid;
            place-items: center;
            width: 100%;
            max-width: 560px;
        }

        /* ============================================================
           FORM
           ============================================================ */
        form {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 40px 38px;
            border-radius: 20px;
            border: 1px solid rgba(216, 181, 106, 0.15);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            max-width: 500px;
            width: 100%;
            transition: border-color 0.3s ease;
        }

        form:hover {
            border-color: rgba(216, 181, 106, 0.3);
        }

        .form-title {
            font-family: 'Cinzel', Georgia, serif;
            font-size: 1.6rem;
            font-weight: 500;
            color: #d8b56a;
            text-align: center;
            margin-bottom: 6px;
            letter-spacing: 1px;
        }

        .form-subtitle {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: 1.1rem;
            font-style: italic;
            color: #a9abb5;
            text-align: center;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 0.75rem;
            font-weight: 500;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            color: #a9abb5;
            margin-bottom: 4px;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            color: #e8e7e2;
            font-family: 'Inter', Arial, sans-serif;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.3s ease, background 0.3s ease;
        }

        input:focus,
        textarea:focus {
            border-color: rgba(216, 181, 106, 0.5);
            background: rgba(255, 255, 255, 0.08);
        }

        input::placeholder,
        textarea::placeholder {
            color: #737681;
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        /* ============================================================
           PULSANTE INVIO — BLU (STILE ORIGINALE)
           ============================================================ */
        .submit-btn {
            width: 100%;
            padding: 14px;
            background: #2c8ad4;
            border: none;
            border-radius: 10px;
            color: #ffffff;
            font-family: 'Inter', Arial, sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: background 0.3s ease, transform 0.2s ease, box-shadow 0.3s ease;
            margin-top: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .submit-btn:hover {
            background: #1a6eb0;
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(44, 138, 212, 0.25);
        }

        .submit-btn:active {
            transform: scale(0.97);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: wait;
            transform: none !important;
        }

        .submit-btn i {
            font-size: 0.9rem;
        }

        /* ============================================================
           FOOTER
           ============================================================ */
        .site-footer {
            padding: 30px 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.055);
            background: #070910;
            text-align: center;
            color: #737681;
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: 1rem;
            font-style: italic;
        }

        .site-footer strong {
            color: #d8b56a;
            font-family: 'Cinzel', Georgia, serif;
            font-weight: 400;
            font-style: normal;
        }

        .site-footer .footer-motto {
            font-size: 1.05rem;
            letter-spacing: 0.5px;
        }

        /* ============================================================
           PLAYER FLOTTANTE (stile coerente)
           ============================================================ */

        .music-player {
            position: fixed;
            right: 24px;
            bottom: 24px;
            z-index: 9999;
            font-family: 'Inter', sans-serif;
        }

        .player-toggle {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            border: 1px solid var(--gold-line, rgba(216,181,106,0.22));
            background: rgba(10, 12, 20, 0.94);
            color: var(--gold, #d8b56a);
            font-size: 1.25rem;
            cursor: pointer;
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
            transition: transform 0.25s ease, border-color 0.25s ease, background 0.25s ease, color 0.4s ease;
            display: grid;
            place-items: center;
        }

        .player-toggle:hover {
            transform: scale(1.05);
            border-color: rgba(255, 216, 106, 0.65);
            background: rgba(18, 18, 42, 0.96);
        }

        .player-panel {
            position: absolute;
            right: 0;
            bottom: 62px;
            width: 280px;
            padding: 16px 17px;
            background: rgba(12, 12, 30, 0.96);
            border: 1px solid rgba(255, 216, 106, 0.18);
            border-radius: 12px;
            backdrop-filter: blur(16px);
            box-shadow: 0 18px 50px rgba(0, 0, 0, 0.55);
            opacity: 0;
            visibility: hidden;
            transform: translateY(8px) scale(0.98);
            transition: opacity 0.22s ease, transform 0.22s ease, visibility 0.22s ease;
        }

        .music-player.open .player-panel {
            opacity: 1;
            visibility: visible;
            transform: translateY(0) scale(1);
        }

        .music-label {
            display: block;
            font-size: 0.58rem;
            letter-spacing: 1.4px;
            color: rgba(255, 216, 106, 0.65);
            margin-bottom: 3px;
        }

        .music-title {
            display: block;
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.15rem;
            color: #eee;
        }

        .music-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 14px;
        }

        .music-controls button {
            width: 34px;
            height: 34px;
            border: 1px solid var(--border, rgba(255,255,255,0.08));
            border-radius: 50%;
            background: transparent;
            color: var(--text, #e8e7e2);
            cursor: pointer;
            transition: border-color 0.3s ease, color 0.3s ease;
        }

        .music-controls button:hover {
            border-color: var(--gold-line);
            color: var(--gold);
        }

        .music-controls .music-volume {
            font-size: 0.85rem;
            opacity: 0.8;
        }

        .music-progress {
            flex: 1;
            min-width: 0;
            height: 3px;
            appearance: none;
            -webkit-appearance: none;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 5px;
            cursor: pointer;
        }

        .music-progress::-webkit-slider-thumb {
            appearance: none;
            -webkit-appearance: none;
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--gold, #d8b56a);
            cursor: pointer;
        }

        .music-progress::-moz-range-thumb {
            width: 9px;
            height: 9px;
            border: 0;
            border-radius: 50%;
            background: var(--gold, #d8b56a);
            cursor: pointer;
        }

        .player-status {
            font-size: 0.68rem;
            color: var(--text-muted, #737681);
        }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 768px) {
            .header-inner {
                min-height: 64px;
                flex-wrap: wrap;
                gap: 12px;
                justify-content: center;
            }

            .logo-sub {
                display: none;
            }

            form {
                padding: 30px 24px;
            }

            .form-title {
                font-size: 1.3rem;
            }

            .back-link {
                font-size: 0.85rem;
            }

            .submit-btn {
                font-size: 0.8rem;
                padding: 12px;
            }

            .music-player {
                right: 16px;
                bottom: 16px;
            }

            .player-panel {
                width: min(280px, calc(100vw - 32px));
            }
        }

        @media (max-width: 480px) {
            .header-inner {
                flex-direction: column;
                gap: 8px;
                padding: 12px 0;
            }

            form {
                padding: 24px 18px;
            }

            .form-title {
                font-size: 1.1rem;
            }

            .form-subtitle {
                font-size: 0.95rem;
            }

            input,
            textarea {
                font-size: 0.85rem;
                padding: 10px 14px;
            }

            .submit-btn {
                font-size: 0.75rem;
                padding: 12px;
            }

            .site-footer {
                font-size: 0.85rem;
                padding: 20px 16px;
            }

            .site-footer .footer-motto {
                font-size: 0.9rem;
            }
        }

        /* ============================================================
           ACCESSIBILITÀ
           ============================================================ */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                transition-duration: 0.01ms !important;
                animation-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>

    <!-- ============================================================
         HEADER
         ============================================================ -->
    <header class="site-header">
        <div class="header-inner">

            
<!-- BACK BUTTON -->
<a class="back-link" href="https://www.echidisofia.org/" aria-label="Torna alla home">
    <i class="fas fa-arrow-left"></i> Echi di Sofia
</a>



            <!-- LOGO -->
            <a href="/" class="logo">
                ECHI DI SOFIA
                <span class="logo-sub">Dove il pensiero attraversa i secoli</span>
            </a>

            <!-- SPAZIO PER EQUILIBRIO (opzionale) -->
            <div style="width: 1px; height: 1px; visibility: hidden;"></div>

        </div>
    </header>

    <!-- ============================================================
         CONTENUTO PRINCIPALE
         ============================================================ -->
    <main class="main-content">
        <div class="contact-container">
            <form id="contactForm" method="POST" action="#">

                <h2 class="form-title">Contattaci</h2>
                <p class="form-subtitle">Domande, suggerimenti, collaborazioni</p>

                <div class="form-group">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" name="nome" placeholder="Il tuo nome" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="La tua email" required>
                </div>

                <div class="form-group">
                    <label for="messaggio">Messaggio</label>
                    <textarea id="messaggio" name="messaggio" rows="5" placeholder="Scrivi il tuo messaggio" required></textarea>
                </div>

                <button class="submit-btn" type="submit">
                    <i class="fas fa-paper-plane"></i> Invia Messaggio
                </button>

            </form>
        </div>
    </main>

    <!-- ============================================================
         FOOTER
         ============================================================ -->
    <footer class="site-footer">
        <p class="footer-motto">
            <strong>Echi di Sofia</strong> — Dove il pensiero attraversa i secoli
        </p>
        <p style="margin-top: 4px; font-size: 0.85rem; font-style: normal; opacity: 0.5;">
            &copy; 2026 Echi di Sofia
        </p>
    </footer>

    <!-- ============================================================
         PLAYER
         ============================================================ -->

    <audio id="myAudio"
           playsinline
           preload="auto"
           src="https://casi0048.github.io/suoni/Strauss.mp3">
    </audio>

    <div class="music-player" id="musicPlayer">

        <div class="player-panel">
            <div>
                <span class="music-label">MUSICA PER LO STUDIO</span>
                <span class="music-title">Strauss – Sul bel Danubio blu</span>
            </div>

            <div class="music-controls">
                <button id="playButton" aria-label="Riproduci musica">▶</button>
                <button class="music-volume" id="volumeToggle" aria-label="Attiva/disattiva audio">🔊</button>
                <input type="range" class="music-progress" id="musicProgress" min="0" max="100" value="0" aria-label="Avanzamento brano">
                <span class="player-status" id="playerStatus">In pausa</span>
            </div>
        </div>

        <button class="player-toggle" id="playerToggle" aria-label="Apri lettore musicale" aria-expanded="false">
            ♫
        </button>

    </div>

    <!-- ============================================================
         GSAP ANIMATION
         ============================================================ -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js">
    </script>

    <script>
        document.addEventListener("DOMContentLoaded", function() {

            /* =========================================================
               GSAP ANIMAZIONI
               ========================================================= */
            gsap.from(".site-header", {
                opacity: 0,
                y: -100,
                duration: 1,
                ease: "power3.out"
            });

            gsap.from("form", {
                opacity: 0,
                scale: 0.92,
                duration: 1.2,
                delay: 0.4,
                ease: "power3.out"
            });

            gsap.from(".form-title, .form-subtitle", {
                opacity: 0,
                y: 30,
                duration: 0.8,
                stagger: 0.15,
                delay: 0.6,
                ease: "power2.out"
            });

            gsap.from(".form-group, .submit-btn", {
                opacity: 0,
                y: 40,
                duration: 0.7,
                stagger: 0.12,
                delay: 0.9,
                ease: "power2.out"
            });

            gsap.from(".site-footer", {
                opacity: 0,
                y: 30,
                duration: 0.8,
                delay: 1.6,
                ease: "power2.out"
            });

            /* =========================================================
               FORM HANDLER
               ========================================================= */
            const form = document.getElementById('contactForm');

            form.addEventListener('submit', function(e) {
                e.preventDefault();

                const nome = document.getElementById('nome').value.trim();
                const email = document.getElementById('email').value.trim();
                const messaggio = document.getElementById('messaggio').value.trim();

                if (!nome || !email || !messaggio) {
                    alert('Per favore, compila tutti i campi.');
                    return;
                }

                const btn = form.querySelector('.submit-btn');
                const originalText = btn.innerHTML;
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Invio...';
                btn.disabled = true;

                setTimeout(function() {
                    alert('Grazie ' + nome + '! Il tuo messaggio è stato ricevuto.');
                    form.reset();
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                }, 1500);
            });

            /* =========================================================
               PLAYER — ECHI DI SOFIA
               ========================================================= */
            const player = document.getElementById("musicPlayer");
            const toggle = document.getElementById("playerToggle");
            const playButton = document.getElementById("playButton");
            const status = document.getElementById("playerStatus");
            const audio = document.getElementById("myAudio");
            const progress = document.getElementById("musicProgress");
            const volumeToggle = document.getElementById("volumeToggle");

            if (player && toggle && playButton && status && audio) {
                toggle.addEventListener("click", function() {
                    const isOpen = player.classList.toggle("open");
                    toggle.setAttribute("aria-expanded", isOpen ? "true" : "false");
                });

                playButton.addEventListener("click", function() {
                    if (audio.paused) {
                        audio.play()
                            .then(function() {
                                playButton.textContent = "❚❚";
                                status.textContent = "In riproduzione";
                            })
                            .catch(function() {
                                status.textContent = "Impossibile avviare";
                            });
                    } else {
                        audio.pause();
                        playButton.textContent = "▶";
                        status.textContent = "In pausa";
                    }
                });

                audio.addEventListener("ended", function() {
                    playButton.textContent = "▶";
                    status.textContent = "In pausa";
                });

                // Aggiorna la barra di progresso
                audio.addEventListener("timeupdate", function() {
                    if (audio.duration) {
                        var percent = (audio.currentTime / audio.duration) * 100;
                        progress.value = percent;
                    }
                });

                progress.addEventListener("input", function() {
                    if (audio.duration) {
                        var time = (this.value / 100) * audio.duration;
                        audio.currentTime = time;
                    }
                });

                // Volume toggle
                var isMuted = false;
                if (volumeToggle) {
                    volumeToggle.addEventListener("click", function() {
                        isMuted = !isMuted;
                        audio.muted = isMuted;
                        this.textContent = isMuted ? "🔇" : "🔊";
                    });
                }

                // Chiudi con ESC
                document.addEventListener("keydown", function(event) {
                    if (event.key === "Escape" && player.classList.contains("open")) {
                        player.classList.remove("open");
                        toggle.setAttribute("aria-expanded", "false");
                    }
                });
            }

        });
    </script>

</body>
</html>
